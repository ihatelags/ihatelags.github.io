<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solace MUD Equipment Bonus Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #0a0e14;
            --panel: #1a202c;
            --text: #e2e8f0;
            --accent: #f6ad55;
            --border: #2d3748;
            --header-bg: #171923;
            --danger: #fc8181;
            --muted: #718096;
            --input-bg: #0f172a;
        }

        body { 
            font-family: 'Segoe UI', 'Consolas', 'Monaco', monospace; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .terminal {
            width: 100%;
            max-width: 1000px;
            background: var(--panel);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        header {
            background: var(--header-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { 
            margin: 0; 
            font-size: 0.9rem; 
            color: var(--accent); 
            letter-spacing: 2px; 
            font-weight: 700;
            text-transform: uppercase;
        }

        .content { padding: 20px; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: var(--input-bg);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus { border-color: var(--accent); }

        .file-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        button.btn-calculate {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #1a202c;
            border: none;
            font-weight: 800;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
            margin-bottom: 20px;
        }

        button.btn-calculate:hover { opacity: 0.9; }

        .results-panel {
            background: var(--header-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .summary-section-title {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 6px;
        }

        .stat-val {
            font-size: 0.8rem;
            font-family: 'Consolas', monospace;
        }

        .unmatched-list {
            grid-column: 1 / -1;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            font-size: 0.75rem;
            color: var(--danger);
        }

        .error-msg { color: var(--danger); padding: 10px; border: 1px solid var(--danger); background: rgba(252, 129, 129, 0.1); border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="terminal">
    <header>
        <h1>Solace Equipment Calculator</h1>
    </header>

    <div class="content">
        <div class="file-input-wrapper">
            <span>Data source: itemdb_solace.csv (Loaded automatically if present)</span>
            <input type="file" id="csvFile" accept=".csv">
        </div>

        <div class="input-group">
            <label for="pasteInput">Paste Gear Output</label>
            <textarea id="pasteInput" placeholder="<worn on finger>    (Glowing) (Humming) the Ring of Glory&#10;<worn on torso>     a suit of darkened platemail..."></textarea>
        </div>

        <button class="btn-calculate" onclick="calculateStats()">Calculate Bonuses</button>

        <div id="output"></div>
    </div>
</div>

<script>
    const CSV_URL = 'itemdb_solace.csv';
    const STAT_MAP = {
        "damage roll": "DAMROLL", "hit roll": "HITROLL", "health": "HIT", "hp": "HIT",
        "fortitude save": "FORT", "will save": "WILL", "reflex save": "REF", "all save": "ALL_SVS",
        "strength": "STR", "intelligence": "INT", "wisdom": "WIS", "dexterity": "DEX", "constitution": "CON",
        "mana": "MANA", "moves": "MOVE", "armor class": "AC"
    };

    function parseItemStats(infoText) {
        const stats = {};
        if (!infoText) return stats;

        const lines = infoText.toLowerCase().split('\n');
        lines.forEach(line => {
            const trimmed = line.trim();
            const generalMatch = trimmed.match(/(?:modifies|modifying|affects) (.*?) by (-?\d+)/i);
            const resMatch = trimmed.match(/(.*?) resistance:?\s*(-?\d+)/i);
            const namedResMatch = trimmed.match(/resistance to (.*?):?\s*(-?\d+)/i);

            if (generalMatch) {
                let key = generalMatch[1].trim();
                const val = parseInt(generalMatch[2]);
                
                const isPhysical = key.includes("physical resistance") || key.includes("physical");
                const isNamedResist = key.includes("resistance to") || key.includes("resistance");

                if (isPhysical) {
                    stats[`RES_PHYSICAL`] = (stats[`RES_PHYSICAL`] || 0) + val;
                } else if (isNamedResist) {
                    const cleanKey = key.replace("resistance to", "").replace("resistance", "").trim();
                    stats[`RES_${cleanKey.toUpperCase()}`] = (stats[`RES_${cleanKey.toUpperCase()}`] || 0) + val;
                } else {
                    let mapped = false;
                    for (let k in STAT_MAP) { 
                        if (key === k || key.includes(k)) { 
                            stats[STAT_MAP[k]] = (stats[STAT_MAP[k]] || 0) + val; 
                            mapped = true;
                            break; 
                        } 
                    }
                    if (!mapped) stats[key.toUpperCase()] = (stats[key.toUpperCase()] || 0) + val;
                }
            } else if (resMatch || namedResMatch) {
                const type = (resMatch ? resMatch[1] : namedResMatch[1]).trim();
                const val = parseInt(resMatch ? resMatch[2] : namedResMatch[2]);
                if (type.toLowerCase() === "physical") {
                    stats[`RES_PHYSICAL`] = (stats[`RES_PHYSICAL`] || 0) + val;
                } else {
                    stats[`RES_${type.toUpperCase()}`] = (stats[`RES_${type.toUpperCase()}`] || 0) + val;
                }
            }
        });
        return stats;
    }

    function cleanItemName(line) {
        let name = line.replace(/<[^>]+>/g, ''); 
        name = name.replace(/\([^)]+\)/g, ''); 
        return name.trim().toLowerCase();
    }

    function calculateStats() {
        const text = document.getElementById('pasteInput').value;
        const fileInput = document.getElementById('csvFile');
        const output = document.getElementById('output');

        if (!text.trim()) {
            output.innerHTML = '<div class="error-msg">Please paste equipment text first.</div>';
            return;
        }

        const parseConfig = {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                processEquipment(results.data, text);
            },
            error: function(err) {
                output.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
            }
        };

        if (fileInput.files.length > 0) {
            Papa.parse(fileInput.files[0], parseConfig);
        } else {
            Papa.parse(CSV_URL, { ...parseConfig, download: true });
        }
    }

    function processEquipment(dbItems, rawText) {
        const output = document.getElementById('output');
        const lines = rawText.split('\n');
        
        const totals = {};
        const unmatched = [];
        let matchedCount = 0;

        lines.forEach(line => {
            if (!line.includes('>')) return;
            const cleaned = cleanItemName(line);
            if (!cleaned) return;

            const dbMatch = dbItems.find(item => item.name && item.name.toLowerCase().trim() === cleaned);

            if (dbMatch) {
                matchedCount++;
                const itemStats = parseItemStats(dbMatch.info);
                for (let stat in itemStats) {
                    totals[stat] = (totals[stat] || 0) + itemStats[stat];
                }
            } else {
                unmatched.push(cleaned);
            }
        });

        let html = `<div class="results-panel">`;

        // Stats Column
        html += `<div><div class="summary-section-title">Character Totals (${matchedCount} Items Matched)</div><div class="stat-grid">`;
        const allSvs = totals['ALL_SVS'] || 0;
        
        const coreStats = ["DAMROLL", "HITROLL", "HIT", "FORT", "WILL", "REF", "STR", "INT", "WIS", "DEX", "CON", "AC"];
        coreStats.forEach(s => {
            let val = totals[s] || 0;
            if (["FORT", "WILL", "REF"].includes(s)) val += allSvs;
            let label = s === "HIT" ? "HP" : s;
            html += `<div class="stat-val"><span style="color:var(--muted)">${label.padEnd(8)}:</span> <span style="color:var(--accent); font-weight:bold">${val}</span></div>`;
        });

        Object.keys(totals).sort().forEach(s => {
            if (coreStats.includes(s) || s === "ALL_SVS" || s.startsWith("RES_")) return;
            html += `<div class="stat-val"><span style="color:var(--muted)">${s.padEnd(8)}:</span> ${totals[s]}</div>`;
        });
        html += `</div></div>`;

        // Resistances Column
        html += `<div><div class="summary-section-title">Resistances Summary</div><div class="stat-grid">`;
        const resList = Object.keys(totals).filter(s => s.startsWith("RES_")).sort();
        if (resList.length > 0) {
            resList.forEach(r => {
                const name = r.replace("RES_", "").toLowerCase();
                html += `<div class="stat-val"><span style="color:var(--muted)">${name.padEnd(10)}:</span> <span style="color:var(--accent); font-weight:bold">${totals[r]}</span></div>`;
            });
        } else {
            html += `<div class="stat-val" style="color:var(--muted)">None</div>`;
        }
        html += `</div></div>`;

        // Unmatched Items Notice
        if (unmatched.length > 0) {
            html += `<div class="unmatched-list"><strong>Items not found in database:</strong><br>` + 
                    unmatched.map(u => `- ${u}`).join('<br>') + `</div>`;
        }

        html += `</div>`;
        output.innerHTML = html;
    }
</script>
</body>
</html>
